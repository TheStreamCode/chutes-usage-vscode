name: Bug report
description: Report a reproducible defect in the extension
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a defect.
        Fill in every field: reports without a version and a reproduction are hard to act on.
        For security issues use SECURITY.md, never a public issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Extension version, from the Extensions view or the release tag.
      placeholder: "0.5.5"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and VS Code version.
      placeholder: "Windows 11, VS Code 1.106"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Smallest sequence that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: For parser problems, include a redacted payload that keeps field names and numeric values. Never include an API key or account identifiers.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report does not contain an API key or personal data.
          required: true
